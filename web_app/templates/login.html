{% extends "base.html" %}
{% block body %}
<div class="card">
  <h3>Connect Mail Account</h3>
  <p class="muted">Use your account credentials to access inbox without Telegram.</p>
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <p><input type="email" name="email" placeholder="Email address" required style="width: 100%;" /></p>
    <p><input type="password" name="password" placeholder="Password" required style="width: 100%;" /></p>
    <button type="submit">Login / Add Account</button>
  </form>
</div>
{% endblock %}
